name: push

# 主链路已转移到本地 Mac，这里只保留手动触发用于调试，
# 避免 Actions 与本地同时读取不同的 sent.json 造成重复推送。
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 发送提醒
        env:
          QQ_APP_ID: ${{ secrets.QQ_APP_ID }}
          QQ_APP_SECRET: ${{ secrets.QQ_APP_SECRET }}
          QQ_GROUP_OPENIDS: ${{ vars.QQ_GROUP_OPENIDS }}
        run: node src/push.mjs