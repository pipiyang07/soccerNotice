name: probe-collect

# 用途已变更：主链路已转移到本地 Mac（住宅 IP 才能访问懂球帝），
# 这里仅作为「云端是否恢复可达」的探测器，不再写回任何数据。
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 探测云端能否采集
        run: node src/collect.mjs